# ==============================================================================
# Nginx Reverse Proxy Configuration for Docker Compose
# Routes Port 80 -> 443 HTTPS and proxies to the internal 'asset-tracker' container
# ==============================================================================

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/nginx/ssl/asset-tracker.crt;
    ssl_certificate_key /etc/nginx/ssl/asset-tracker.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;

    location / {
        proxy_pass http://asset-tracker:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }
}
