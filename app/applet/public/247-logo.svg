<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Solid Jet Black Background Square -->
  <rect width="160" height="160" rx="18" fill="#000000"/>
  
  <!-- Subtle Elegant Glossy Inner Glow Border -->
  <rect x="1" y="1" width="158" height="158" rx="17" fill="none" stroke="#22252a" stroke-width="2"/>

  <!-- Centered Optical Group for '[24]7.ai' -->
  <g transform="translate(80, 89)" text-anchor="middle" dominant-baseline="central">
    <!-- Opening Bracket '[' -->
    <text 
      x="-64" 
      y="0" 
      fill="#ffffff" 
      font-family="'Arial Black', 'Impact', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-size="46" 
      font-weight="900"
    >[</text>

    <!-- '2' -->
    <text 
      x="-45" 
      y="0" 
      fill="#ffffff" 
      font-family="'Arial Black', 'Impact', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-size="46" 
      font-weight="900" 
      letter-spacing="-1.5"
    >2</text>

    <!-- '4' -->
    <text 
      x="-19" 
      y="0" 
      fill="#ffffff" 
      font-family="'Arial Black', 'Impact', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-size="46" 
      font-weight="900" 
      letter-spacing="-1.5"
    >4</text>

    <!-- Closing Bracket ']' -->
    <text 
      x="3" 
      y="0" 
      fill="#ffffff" 
      font-family="'Arial Black', 'Impact', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-size="46" 
      font-weight="900"
    >]</text>

    <!-- '7' in [24]7.ai signature orange -->
    <text 
      x="27" 
      y="0" 
      fill="#ee691e" 
      font-family="'Arial Black', 'Impact', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-size="48" 
      font-weight="900" 
      letter-spacing="-0.5"
    >7</text>

    <!-- '.ai' in crisp bold white -->
    <text 
      x="57" 
      y="2" 
      fill="#ffffff" 
      font-family="'Arial Black', 'Impact', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
      font-size="34" 
      font-weight="900" 
      letter-spacing="-0.5"
    >.ai</text>
  </g>
</svg>
