# ==============================================================================
# [24]7.ai Asset Tracking & Security Clearance Gateway - Docker Compose
# Orchestrates the Asset Tracker application with persistence and Nginx SSL
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Service 1: Node.js Core Asset Tracker Engine
  # ----------------------------------------------------------------------------
  asset-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 247ai-asset-tracker
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://asset_admin:SecretAssetPass247!@247ai-postgres-db:5432/asset_tracker_db
      - PGHOST=247ai-postgres-db
      - PGPORT=5432
      - PGUSER=asset_admin
      - PGPASSWORD=SecretAssetPass247!
      - PGDATABASE=asset_tracker_db
    depends_on:
      - postgres-db
    # Mount persistent volume so data and inventory survive container restarts/updates
    volumes:
      - ./database.json:/app/database.json
      - ./public:/app/public
    networks:
      - asset-network
    ports:
      - "3000:3000"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Service 2: PostgreSQL Enterprise Relational Database
  # ----------------------------------------------------------------------------
  postgres-db:
    image: postgres:16-alpine
    container_name: 247ai-postgres-db
    restart: always
    environment:
      - POSTGRES_USER=asset_admin
      - POSTGRES_PASSWORD=SecretAssetPass247!
      - POSTGRES_DB=asset_tracker_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - asset-network

  # ----------------------------------------------------------------------------
  # Service 3: Nginx SSL / HTTPS Reverse Proxy (Optional, if using in Docker)
  # ----------------------------------------------------------------------------
  nginx-proxy:
    image: nginx:alpine
    container_name: 247ai-nginx-proxy
    restart: always
    ports:
      - "443:443"
    volumes:
      - ./nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      asset-tracker:
        condition: service_healthy
    networks:
      - asset-network

volumes:
  postgres-data:

networks:
  asset-network:
    driver: bridge
